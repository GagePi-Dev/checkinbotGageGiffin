# INF601 - Advanced Programming in Python
# Gage Giffin
# Scheduled Check-In Bot

name: Scheduled Check-In Bot

on:
  # GitHub cron is always UTC. Central daylight time is UTC-5, so midnight Central
  # is 05:00 UTC - a run scheduled near there can be delayed into the next day and
  # miss a check-in. These three land at 08:00, 14:00 and 20:00 Central, so every
  # Central day gets three attempts and the closest is four hours clear of midnight.
  schedule:
    - cron: "0 13 * * *"   # 08:00 Central
    - cron: "0 19 * * *"   # 14:00 Central
    - cron: "0 1 * * *"    # 20:00 Central (the previous Central day)
  # Lets the same job be started by hand from the Actions tab.
  workflow_dispatch:

# The job pushes the artifact back to the repo. Without this the default token is
# read-only and the push fails with a 403 for github-actions[bot].
permissions:
  contents: write

# Two runs committing to the same branch at once would collide, so runs queue
# instead. cancel-in-progress stays false: a run that is part-way through replying
# to a check-in should be allowed to finish.
concurrency:
  group: checkin-bot
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          # Full history, so the rebase before pushing has something to rebase onto.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the bot
        env:
          # The token is a repository secret, so GitHub masks it in the logs.
          PRACTICE_API_TOKEN: ${{ secrets.PRACTICE_API_TOKEN }}
          # These two are repository variables, so they are read with vars, not secrets.
          PRACTICE_API_URL: ${{ vars.PRACTICE_API_URL }}
          INSTRUCTOR_ID: ${{ vars.INSTRUCTOR_ID }}
        run: python checkin.py

      - name: Commit the artifact back to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifact
          # A run that collects nothing new has nothing to commit, and committing
          # nothing would fail the step.
          if git diff --staged --quiet; then
            echo "No artifact changes to commit."
          else
            git commit -m "Update artifact ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Upload the artifact to the Actions run
        uses: actions/upload-artifact@v4
        with:
          name: artifact
          path: artifact/
